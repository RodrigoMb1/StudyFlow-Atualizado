<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="stylesheet" href="Style.css">
</head>

<body class="pagina-login">

    <header id="cabecalho-login">
        <span class="logo">StudyFlow</span>
    </header>

    <main id="conteudo-login">

        <section id="caixa-login" class="caixa-login">

        <img src="./assets/icons%20svg/user%20icon.svg" alt="" class="icone-login" aria-hidden="true">

            <h1 class="titulo-login">Entrar no StudyFlow</h1>

            <form id="form-login" action="index.html">

                <div class="campo">
                    <label for="input-email">Email</label>
                    <input type="email" id="input-email" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="input-senha">Senha</label>
                    <input type="password" id="input-senha" autocomplete="current-password" required>
                </div>

                <button type="submit" class="botao-entrar">Entrar</button>

            </form>

        </section>

    </main>

</body>

</html>
